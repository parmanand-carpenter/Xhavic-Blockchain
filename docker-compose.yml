services:
  # ============================================================
  # op-geth: L2 execution engine — SEQUENCER node (PRIVATE)
  # ------------------------------------------------------------
  # SECURITY NOTE (for auditors):
  # This is the PRIVATE sequencer's op-geth and is NEVER exposed to
  # the public internet. `miner` + `debug` APIs are enabled here ONLY for
  # internal services over the private network:
  #   - miner : op-batcher DA throttling (miner_setMaxDASize)
  #   - debug : op-challenger cannon trace execution (L2 witnesses)
  # Both are reachable only by the batcher/challenger internally.
  # Public RPC nodes run a SEPARATE config with --http.api=eth,net,web3
  # (NO miner, NO debug, NO txpool) behind proxyd, so these are never public.
  # See the 5-server mainnet architecture: sequencer/services are private,
  # only the RPC node + explorer are public.
  # ------------------------------------------------------------
  # Engine API (8551) is NOT published — internal Docker network only
  # ============================================================
  op-geth:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-geth:v1.101702.2
    container_name: op-geth
    restart: unless-stopped
    networks:
      - l2-internal
    volumes:
      - ./sequencer:/workspace
      - op_geth_data:/workspace/op-geth-data
    working_dir: /workspace
    env_file:
      - .env
    ports:
      - "8545:8545"   # Public HTTP JSON-RPC
      - "8546:8546"   # Public WebSocket RPC
      # Port 8551 (Engine API) intentionally NOT published — op-node reaches it internally
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -d /workspace/op-geth-data/geth/chaindata ]; then
          echo "Initializing geth datadir..."
          geth init --datadir=/workspace/op-geth-data --state.scheme=hash /workspace/genesis.json
        fi
        echo "Starting geth..."
        exec geth \
          --datadir=/workspace/op-geth-data \
          --http \
          --http.addr=0.0.0.0 \
          --http.port=8545 \
          --http.vhosts=${HTTP_VHOSTS:-*} \
          --http.corsdomain=${RPC_CORS_DOMAIN:-*} \
          --http.api=eth,net,web3,miner,debug \
          --ws \
          --ws.addr=0.0.0.0 \
          --ws.port=8546 \
          --ws.origins=${RPC_CORS_DOMAIN:-*} \
          --ws.api=eth,net,web3 \
          --authrpc.addr=0.0.0.0 \
          --authrpc.port=8551 \
          --authrpc.jwtsecret=/workspace/jwt.txt \
          --authrpc.vhosts=op-geth \
          --syncmode=full \
          --gcmode=archive \
          --rollup.disabletxpoolgossip=true \
          --metrics \
          --metrics.addr=0.0.0.0 \
          --metrics.port=6060
    healthcheck:
      test: ["CMD", "wget", "--header=Host: testrpc.xhaviscan.com", "--quiet", "--tries=1", "--timeout=10", "--output-document=-", "http://localhost:8545"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================================
  # op-node: L2 consensus / sequencer
  # P2P port (9222) is published. Admin RPC (8547) is NOT published.
  # ============================================================
  op-node:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.19.0
    container_name: op-node
    restart: unless-stopped
    networks:
      - l2-internal
    volumes:
      - ./sequencer:/workspace
      - op_geth_data:/workspace/op-geth-data
    working_dir: /workspace
    env_file:
      - .env
    environment:
      - OP_NODE_P2P_SEQUENCER_KEY=${SEQUENCER_PRIVATE_KEY}
    ports:
      - "9222:9222"   # P2P discovery and block gossip
      # Port 8547 (op-node admin RPC) intentionally NOT published
    command: >
      op-node
      --l1=${L1_RPC_URL}
      --l1.beacon=${L1_BEACON_URL}
      --l2=http://op-geth:8551
      --l2.jwt-secret=/workspace/jwt.txt
      --rollup.config=/workspace/rollup.json
      --sequencer.enabled=true
      --sequencer.stopped=false
      --sequencer.max-safe-lag=600
      --verifier.l1-confs=4
      --p2p.advertise.ip=${P2P_ADVERTISE_IP}
      --p2p.listen.ip=0.0.0.0
      --p2p.listen.tcp=9222
      --p2p.listen.udp=9222
      --rpc.addr=0.0.0.0
      --rpc.port=8547
      --rpc.enable-admin
      --safedb.path=/workspace/op-node-safedb
      --metrics.enabled
      --metrics.addr=0.0.0.0
      --metrics.port=7301
      --log.level=info
      --log.format=json
    depends_on:
      op-geth:
        condition: service_healthy
    # NOTE: op-node v1.19.0+ images are DISTROLESS (no wget/sh), so a wget
    # healthcheck cannot run. Health is monitored via Prometheus on :7301.
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================================
  # op-batcher: submits L2 tx batches to L1
  # Admin RPC bound to 127.0.0.1 (container-local only)
  # Uses EIP-4844 blobs (cheaper than calldata post-Cancun)
  # --max-channel-duration=300 (1 hour) is the mainnet value: a batch is posted
  #   at least every ~1h (or sooner when a channel fills). For fast LOCAL testing
  #   you can temporarily drop it to 5 (~1 min) to make the safe head advance.
  # ============================================================
  batcher:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-batcher:v1.16.9
    container_name: op-batcher
    restart: unless-stopped
    networks:
      - l2-internal
    volumes:
      - ./batcher:/workspace
    working_dir: /workspace
    env_file:
      - ./batcher/.env
      - .env
    environment:
      - OP_BATCHER_L1_ETH_RPC=${L1_RPC_URL}
      - OP_BATCHER_PRIVATE_KEY=${BATCHER_PRIVATE_KEY}
    command: >
      op-batcher
      --rpc.addr=127.0.0.1
      --rpc.port=8548
      --rpc.enable-admin
      --max-channel-duration=300
      --data-availability-type=auto
      --batch-type=1
      --max-pending-tx=10
      --resubmission-timeout=180s
      --txmgr.send-timeout=2m
      --compression-algo=brotli-10
      --metrics.enabled
      --metrics.addr=0.0.0.0
      --metrics.port=7302
      --log.level=info
      --log.format=json
    depends_on:
      op-node:
        condition: service_started
    # distroless image (no wget) — monitored via Prometheus on :7302
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================================
  # op-proposer: submits L2 output roots to L1 dispute game
  # Admin RPC bound to 127.0.0.1. allow-non-finalized removed for safety.
  # ============================================================
  proposer:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-proposer:v1.16.3
    container_name: op-proposer
    restart: unless-stopped
    networks:
      - l2-internal
    volumes:
      - ./proposer:/workspace
    working_dir: /workspace
    env_file:
      - ./proposer/.env
      - .env
    environment:
      - OP_PROPOSER_L1_ETH_RPC=${L1_RPC_URL}
      - OP_PROPOSER_PRIVATE_KEY=${PROPOSER_PRIVATE_KEY}
    command: >
      op-proposer
      --rpc.addr=127.0.0.1
      --rpc.port=8560
      --rollup-rpc=http://op-node:8547
      --wait-node-sync=true
      --metrics.enabled
      --metrics.addr=0.0.0.0
      --metrics.port=7303
      --log.level=info
      --log.format=json
    depends_on:
      op-node:
        condition: service_started
    # distroless image (no wget) — monitored via Prometheus on :7303
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================================
  # op-challenger: monitors and challenges invalid output roots
  # ============================================================
  challenger:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-challenger:v1.9.3
    container_name: op-challenger
    restart: unless-stopped
    networks:
      - l2-internal
    volumes:
      - ./challenger:/workspace
    working_dir: /workspace
    env_file:
      - ./challenger/.env
      - .env
    environment:
      - OP_CHALLENGER_L1_ETH_RPC=${L1_RPC_URL}
      - OP_CHALLENGER_L1_BEACON=${L1_BEACON_URL}
      - OP_CHALLENGER_PRIVATE_KEY=${CHALLENGER_PRIVATE_KEY}
    command: >
      op-challenger
      --trace-type=permissioned
      --cannon-l2-genesis=/workspace/genesis.json
      --cannon-rollup-config=/workspace/rollup.json
      --l2-eth-rpc=http://op-geth:8545
      --rollup-rpc=http://op-node:8547
      --datadir=/workspace/data
      --metrics.enabled
      --metrics.addr=0.0.0.0
      --metrics.port=7304
      --log.level=info
      --log.format=json
    depends_on:
      op-node:
        condition: service_started
    # distroless image (no bash/wget) — monitored via Prometheus on :7304
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ============================================================
  # dispute-mon: tracks dispute game health
  # Metrics port (7300) NOT published externally — scrape from your monitoring stack
  # OP_DISPUTE_MON_NETWORK removed — not applicable to custom chain 16586
  # ============================================================
  dispute-mon:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-dispute-mon:v1.5.2
    container_name: dispute-mon
    restart: unless-stopped
    networks:
      - l2-internal
    volumes:
      - ./dispute-mon:/workspace
    working_dir: /workspace
    env_file:
      - ./dispute-mon/.env
      - .env
    environment:
      - OP_DISPUTE_MON_L1_ETH_RPC=${L1_RPC_URL}
      - OP_DISPUTE_MON_ROLLUP_RPC=http://op-node:8547
      - OP_DISPUTE_MON_MONITOR_INTERVAL=10s
      - OP_DISPUTE_MON_LOG_LEVEL=info
      - OP_DISPUTE_MON_LOG_FORMAT=json
      - OP_DISPUTE_MON_METRICS_ADDR=0.0.0.0
      - OP_DISPUTE_MON_METRICS_ENABLED=true
      - OP_DISPUTE_MON_METRICS_PORT=7300
    depends_on:
      op-node:
        condition: service_started
    # distroless image (no wget) — monitored via Prometheus on :7300
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  l2-internal:
    driver: bridge

volumes:
  op_geth_data:
